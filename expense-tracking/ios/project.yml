name: ExpenseTracker
options:
  bundleIdPrefix: com.ydai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - ExpenseTracker
    info:
      path: ExpenseTracker/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ydai.ExpenseTracker
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: GRDB
